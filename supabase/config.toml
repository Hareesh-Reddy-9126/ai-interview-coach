# Supabase project configuration.
# `npx supabase link --project-ref <ref>` replaces the project_id below with
# your cloud project ref. For local development this is just a stack name.
project_id = "ai-interview-lab"

# All edge functions require a valid Supabase JWT. Function code additionally
# verifies resource ownership before touching user data.
[functions.interview-ai]
verify_jwt = true

[functions.compute-analytics]
verify_jwt = true

[functions.analyze-resume]
verify_jwt = true

[functions.generate-roadmap]
verify_jwt = true

[functions.evaluate-code]
verify_jwt = true
