# Supabase project configuration.
# Replace the placeholder below with your new project ref, or run:
#   npx supabase link --project-ref <your-new-project-ref>
project_id = "REPLACE_WITH_NEW_PROJECT_REF"

# All edge functions require a valid Supabase JWT. Function code additionally
# verifies resource ownership before touching user data.
[functions.interview-ai]
verify_jwt = true

[functions.compute-analytics]
